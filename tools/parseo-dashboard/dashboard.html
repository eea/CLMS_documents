<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>parsEO Dashboard — CLMS Filename Tool</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242736;
  --border: #2e3148;
  --text: #e4e6f0;
  --text-dim: #8b8fa8;
  --accent: #5b8def;
  --accent2: #7c5cfc;
  --green: #3fb97f;
  --red: #e45a5a;
  --orange: #e8a84c;
  --font: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-ui);
  min-height: 100vh; display: flex; flex-direction: column;
}
header {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 16px 24px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
header h1 { font-family: var(--font); font-size: 20px; font-weight: 600; }
header h1 span.accent { color: var(--accent); }
header .sub { color: var(--text-dim); font-size: 13px; margin-left: auto; }
.conn-status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; }
.conn-dot.ok { background: var(--green); }
.conn-dot.ko { background: var(--red); }
.conn-dot.pending { background: var(--orange); }
/* Layout */
.main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px; flex: 1; }
@media (max-width: 768px) { .main { grid-template-columns: 1fr; } }
/* Sidebar */
.sidebar {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.sidebar h3 { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
.sidebar select, .sidebar input { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
.sidebar select:focus, .sidebar input:focus { border-color: var(--accent); }
/* Content */
.content { display: flex; flex-direction: column; gap: 16px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px;
}
.card h3 { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
/* Preview */
.preview-box {
  background: #0a0c12; border: 1px solid var(--border); border-radius: 6px;
  padding: 14px 16px; font-family: var(--font); font-size: 14px;
  word-break: break-all; min-height: 44px; position: relative;
}
.preview-box .label {
  position: absolute; top: -10px; left: 12px; background: var(--surface);
  padding: 0 6px; font-size: 10px; text-transform: uppercase; color: var(--text-dim);
}
.copy-btn {
  position: absolute; right: 8px; top: 8px; background: var(--surface2);
  border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px;
  border-radius: 4px; font-size: 11px; cursor: pointer; transition: all .15s;
}
.copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
/* Buttons */
.btn { padding: 8px 20px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font-ui); transition: all .15s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #4a7de0; }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover { background: #35a86e; }
.btn-sm { padding: 4px 12px; font-size: 11px; }
/* Form */
.form-row { margin-bottom: 12px; }
.form-row label { display: block; font-size: 11px; font-weight: 500; color: var(--text-dim); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .3px; }
.form-row input, .form-row select { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 5px; font-size: 13px; outline: none; }
.form-row input:focus, .form-row select:focus { border-color: var(--accent); }
/* JSON output */
.json-box {
  background: #0a0c12; border: 1px solid var(--border); border-radius: 6px;
  padding: 14px; font-family: var(--font); font-size: 12px; line-height: 1.5;
  white-space: pre-wrap; overflow-x: auto; max-height: 400px; overflow-y: auto;
}
/* Tabs */
.tab-bar { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab-item { padding: 10px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-dim); transition: all .15s; }
.tab-item:hover { color: var(--text); }
.tab-item.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }
/* Schema list */
.schema-list { display: flex; flex-wrap: wrap; gap: 6px; }
.schema-tag {
  padding: 4px 10px; background: var(--surface2); border-radius: 4px;
  font-size: 11px; cursor: pointer; transition: all .15s; font-family: var(--font);
}
.schema-tag:hover { background: var(--accent); color: #fff; }
.schema-tag.active { background: var(--accent); color: #fff; }
/* Validation */
.val-item { padding: 8px 12px; border-radius: 4px; margin-bottom: 4px; font-size: 12px; border-left: 3px solid; }
.val-pass { background: rgba(63,185,127,.1); border-left-color: var(--green); color: var(--green); }
.val-fail { background: rgba(228,90,90,.1); border-left-color: var(--red); color: var(--red); }
.val-warn { background: rgba(232,168,76,.1); border-left-color: var(--orange); color: var(--orange); }
/* Spinner */
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1><span class="accent">parsEO</span> Dashboard</h1>
  <span style="font-size:13px;color:var(--text-dim)">CLMS Filename Tool</span>
  <div class="sub">
    <div class="conn-status">
      <span class="conn-dot pending" id="conn-dot"></span>
      <span id="conn-text">Connecting…</span>
      <span style="color:var(--text-dim);margin-left:8px;font-size:11px" id="api-version"></span>
    </div>
  </div>
</header>

<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <h3>Schema Family</h3>
    <select id="family-select" onchange="onFamilyChange()" disabled>
      <option value="">— Select —</option>
    </select>

    <div id="schema-versions" style="display:none">
      <h3 style="margin-top:8px">Version</h3>
      <div class="schema-list" id="version-list"></div>
    </div>

    <div id="schema-fields" style="display:none;margin-top:8px">
      <h3>Fields</h3>
      <div id="field-inputs"></div>
      <button class="btn btn-sm btn-success" style="margin-top:8px;width:100%" onclick="assembleFilename()">Assemble Filename</button>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Tab bar -->
    <div class="card" style="padding:0 16px">
      <div class="tab-bar">
        <div class="tab-item active" onclick="switchTab(this,'tab-filename')">Filename</div>
        <div class="tab-item" onclick="switchTab(this,'tab-parse')">Parse</div>
        <div class="tab-item" onclick="switchTab(this,'tab-schema')">Schema</div>
        <div class="tab-item" onclick="switchTab(this,'tab-validate')">Validate</div>
      </div>

      <!-- Filename tab -->
      <div class="tab-pane active" id="tab-filename">
        <div class="preview-box" style="margin-bottom:16px">
          <span class="label">ASSEMBLED FILENAME</span>
          <span id="filename-preview" style="color:var(--text-dim)">Select a family, fill fields, and assemble.</span>
          <button class="copy-btn" onclick="copyText('filename-preview')">Copy</button>
        </div>
        <div style="font-size:12px;color:var(--text-dim)" id="filename-meta"></div>
      </div>

      <!-- Parse tab -->
      <div class="tab-pane" id="tab-parse">
        <div class="form-row">
          <label>Filename to Parse</label>
          <input id="parse-input" placeholder="CLMS_HRLVLCC_GRA_S2021_R10m_E27N48_03035_V01_R00.tif">
        </div>
        <button class="btn btn-sm btn-primary" onclick="parseFilename()">Parse</button>
        <div style="margin-top:12px">
          <div class="json-box" id="parse-result" style="min-height:80px">Parsed fields will appear here.</div>
        </div>
      </div>

      <!-- Schema tab -->
      <div class="tab-pane" id="tab-schema">
        <div class="json-box" id="schema-json" style="min-height:200px">Select a family and version to view the schema.</div>
      </div>

      <!-- Validate tab -->
      <div class="tab-pane" id="tab-validate">
        <div class="form-row">
          <label>Schema JSON</label>
          <textarea id="validate-input" style="width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-family:var(--font);font-size:12px;min-height:200px;resize:vertical" placeholder='Paste a parsEO schema JSON here…'></textarea>
        </div>
        <button class="btn btn-sm btn-primary" onclick="validateSchema()">Validate</button>
        <div id="validate-results" style="margin-top:12px"></div>
      </div>
    </div>

    <!-- Schema info card -->
    <div class="card" id="schema-info-card" style="display:none">
      <h3>Schema Info</h3>
      <div id="schema-info" style="font-size:13px;line-height:1.6"></div>
    </div>
  </div>
</div>

<script>
let API_BASE = '';
let currentFamily = '';
let currentVersion = '';
let currentSchema = null;
let assembleDebounce = null;

// Safe HTML escaping
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Fetch helper that checks response.ok before parsing JSON
function apiJSON(url, opts) {
  return fetch(url, opts).then(r => {
    if (!r.ok) return r.json().then(d => Promise.reject(d.detail || r.statusText));
    return r.json();
  });
}

function connectAPI() {
  API_BASE = document.getElementById('api-url').value.replace(/\/+$/, '');
  const dot = document.getElementById('conn-dot');
  const text = document.getElementById('conn-text');
  const ver = document.getElementById('api-version');
  dot.className = 'conn-dot pending';
  text.textContent = 'Connecting…';

  apiJSON(API_BASE + '/api/health')
    .then(d => {
      dot.className = 'conn-dot ok';
      text.textContent = 'Connected';
      ver.textContent = 'v' + (d.version || '?');
      loadFamilies();
    })
    .catch(e => {
      dot.className = 'conn-dot ko';
      text.textContent = 'Connection failed: ' + e.message;
    });
}

function loadFamilies() {
  const sel = document.getElementById('family-select');
  sel.disabled = true;
  sel.innerHTML = '<option value="">Loading…</option>';

  apiJSON(API_BASE + '/api/families')
    .then(d => {
      sel.innerHTML = '<option value="">— Select family —</option>';
      // Sort families
      const families = (d.families || []).sort();
      for (const f of families) {
        sel.innerHTML += `<option value="${esc(f)}">${esc(f.toUpperCase())}</option>`;
      }
      sel.disabled = false;
    })
    .catch(e => {
      sel.innerHTML = '<option value="">Error: ' + e.message + '</option>';
    });
}

function onFamilyChange() {
  const family = document.getElementById('family-select').value;
  currentFamily = family;
  document.getElementById('schema-versions').style.display = 'none';
  document.getElementById('schema-fields').style.display = 'none';
  document.getElementById('schema-info-card').style.display = 'none';
  document.getElementById('filename-preview').textContent = 'Select a family and version.';
  document.getElementById('schema-json').textContent = 'Loading…';

  if (!family) return;

  const vlist = document.getElementById('version-list');
  vlist.innerHTML = '<span class="spinner"></span>';

  apiJSON(API_BASE + '/api/families/' + encodeURIComponent(family) + '/versions')
    .then(d => {
      const versions = d.versions || [];
      if (versions.length === 0) {
        vlist.innerHTML = '<span style="color:var(--text-dim);font-size:12px">No versions</span>';
        return;
      }
      document.getElementById('schema-versions').style.display = 'block';
      vlist.innerHTML = '';
      for (const v of versions) {
        const tag = document.createElement('span');
        tag.className = 'schema-tag';
        tag.textContent = v;
        tag.onclick = () => selectVersion(v, tag);
        vlist.appendChild(tag);
      }
      // Select latest
      selectVersion(versions[versions.length - 1], vlist.firstChild);
    })
    .catch(e => {
      vlist.innerHTML = '<span style="color:var(--red);font-size:12px">' + e.message + '</span>';
    });
}

function selectVersion(version, el) {
  currentVersion = version;
  document.querySelectorAll('#version-list .schema-tag').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');

  // Load schema
  const family = currentFamily;
  fetch(API_BASE + '/api/families/' + encodeURIComponent(family) + '/schemas/' + encodeURIComponent(version))
    .then(r => r.json())
    .then(schema => {
      currentSchema = schema;
      document.getElementById('schema-json').textContent = JSON.stringify(schema, null, 2);
      buildFieldInputs(schema);
      showSchemaInfo(schema);
    })
    .catch(e => {
      document.getElementById('schema-json').textContent = 'Error: ' + e.message;
    });
}

function buildFieldInputs(schema) {
  const container = document.getElementById('field-inputs');
  const fields = schema.fields || {};
  container.innerHTML = '';
  document.getElementById('schema-fields').style.display = 'block';

  const template = schema.template || '';
  // Extract field order from template
  const fieldOrder = [...template.matchAll(/\{(\w+)\}/g)].map(m => m[1]);
  const seen = new Set();

  for (const f of fieldOrder) {
    if (f === 'extension' || seen.has(f)) continue;
    seen.add(f);
    const def = fields[f];
    if (!def) continue;
    addFieldInput(container, f, def);
  }

  // Add any remaining fields not in template
  for (const [name, def] of Object.entries(fields)) {
    if (seen.has(name)) continue;
    if (name === 'extension') continue;
    seen.add(name);
    addFieldInput(container, name, def);
  }

  // Extension
  if (fields.extension) {
    addFieldInput(container, 'extension', fields.extension);
  }
}

function addFieldInput(container, name, def) {
  const div = document.createElement('div');
  div.className = 'form-row';
  const label = document.createElement('label');
  label.textContent = name.replace(/_/g, ' ');
  div.appendChild(label);

  let input;
  if (def.enum && def.enum.length <= 20) {
    input = document.createElement('select');
    input.innerHTML = '<option value="">— Select —</option>';
    for (const v of def.enum) {
      input.innerHTML += `<option value="${v}">${v}</option>`;
    }
  } else if (def.enum && def.enum.length > 20) {
    input = document.createElement('input');
    input.placeholder = def.enum.slice(0, 5).join(', ') + '…';
    if (def.enum.length === 1) input.value = def.enum[0];
  } else {
    input = document.createElement('input');
    if (def.pattern) {
      input.placeholder = 'regex: ' + def.pattern.slice(0, 30);
    }
    // Default values for common fields
    if (name === 'programme') input.value = 'CLMS';
    if (name === 'type') input.value = 'R';
    if (name === 'epsg_code') input.value = '03035';
    if (name === 'variant') input.value = 'S2';
  }
  input.dataset.fieldName = name;
  input.onchange = () => assembleFilename();
  input.oninput = () => assembleFilename();
  div.appendChild(input);
  container.appendChild(div);
}

function assembleFilename() {
  // Debounce: wait 300ms after last input before firing
  if (assembleDebounce) clearTimeout(assembleDebounce);
  assembleDebounce = setTimeout(() => _doAssemble(), 300);
}

function _doAssemble() {
  const preview = document.getElementById('filename-preview');
  if (!currentSchema) return;

  const fields = {};
  const inputs = document.querySelectorAll('#field-inputs input, #field-inputs select');
  for (const el of inputs) {
    const name = el.dataset.fieldName;
    if (!name) continue;
    const val = el.value.trim();
    if (val) fields[name] = val;
  }

  // Add programme from enum if not set
  if (!fields.programme && currentSchema.fields?.programme?.enum?.length === 1) {
    fields.programme = currentSchema.fields.programme.enum[0];
  }

  if (Object.keys(fields).length === 0) {
    preview.textContent = 'Fill in fields and assemble.';
    return;
  }

  preview.textContent = 'Assembling…';

  apiJSON(API_BASE + '/api/assemble', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      family: currentFamily,
      version: currentVersion,
      fields: fields
    })
  })
    .then(d => {
      if (d.filename) {
        preview.textContent = d.filename;
        document.getElementById('filename-meta').textContent = `Family: ${currentFamily} · Version: ${d.version || currentVersion}`;
      } else if (d.detail) {
        preview.textContent = 'Error: ' + d.detail;
      }
    })
    .catch(e => {
      preview.textContent = 'Error: ' + e.message;
    });
}

function showSchemaInfo(schema) {
  const card = document.getElementById('schema-info-card');
  card.style.display = 'block';
  const info = document.getElementById('schema-info');
  const fields = schema.fields || {};
  const fieldCount = Object.keys(fields).length;
  const templates = schema.template || '—';
  const examples = schema.examples || [];

  let html = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px">
      <div><span style="color:var(--text-dim)">ID:</span> ${schema.schema_id || '—'}</div>
      <div><span style="color:var(--text-dim)">Status:</span> ${schema.status || '—'}</div>
      <div><span style="color:var(--text-dim)">Version:</span> ${schema.schema_version || '—'}</div>
      <div><span style="color:var(--text-dim)">Fields:</span> ${fieldCount}</div>
    </div>
    <div style="margin-top:8px;font-size:12px">
      <span style="color:var(--text-dim)">Template:</span>
      <code style="display:block;padding:6px 8px;background:var(--surface2);border-radius:4px;margin-top:4px;font-size:11px">${templates}</code>
    </div>
  `;
  if (examples.length > 0) {
    html += `<div style="margin-top:8px;font-size:12px"><span style="color:var(--text-dim)">Examples:</span>`;
    for (const ex of examples.slice(0, 3)) {
      html += `<code style="display:block;padding:2px 0;font-size:11px">${ex}</code>`;
    }
    html += `</div>`;
  }
  info.innerHTML = html;
}

function parseFilename() {
  const fn = document.getElementById('parse-input').value.trim();
  const result = document.getElementById('parse-result');
  if (!fn) { result.textContent = 'Enter a filename to parse.'; return; }

  result.textContent = 'Parsing…';
  apiJSON(API_BASE + '/api/parse', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename: fn })
  })
    .then(d => {
      if (d.parsed) {
        result.textContent = JSON.stringify(d.parsed, null, 2);
      } else if (d.detail) {
        result.textContent = 'Error: ' + JSON.stringify(d.detail, null, 2);
      }
    })
    .catch(e => { result.textContent = 'Error: ' + e.message; });
}

function validateSchema() {
  const input = document.getElementById('validate-input').value.trim();
  const results = document.getElementById('validate-results');
  if (!input) { results.innerHTML = '<div style="color:var(--text-dim);font-size:12px">Paste a schema JSON first.</div>'; return; }

  let schema;
  try { schema = JSON.parse(input); }
  catch(e) { results.innerHTML = `<div class="val-item val-fail">Invalid JSON: ${e.message}</div>`; return; }

  results.innerHTML = '<span class="spinner"></span> Validating…';

  apiJSON(API_BASE + '/api/validate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ schema: schema })
  })
    .then(d => {
      let html = '';
      if (d.errors && d.errors.length) {
        for (const e of d.errors) html += `<div class="val-item val-fail">${e}</div>`;
      }
      if (d.warnings && d.warnings.length) {
        for (const w of d.warnings) html += `<div class="val-item val-warn">${w}</div>`;
      }
      if (d.valid) {
        html = `<div class="val-item val-pass">Schema is valid (${d.errors.length} errors, ${d.warnings.length} warnings)</div>` + html;
      } else {
        html = `<div class="val-item val-fail">Schema is invalid</div>` + html;
      }
      results.innerHTML = html;
    })
    .catch(e => { results.innerHTML = `<div class="val-item val-fail">Error: ${e.message}</div>`; });
}

function switchTab(el, tabId) {
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(tabId).classList.add('active');
}

function copyText(elId) {
  const el = document.getElementById(elId);
  const text = el.textContent || el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = el.parentElement.querySelector('.copy-btn');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy', 1500); }
  });
}

// Auto-connect on load
document.addEventListener('DOMContentLoaded', () => {
  API_BASE = '';
  const dot = document.getElementById('conn-dot');
  dot.className = 'conn-dot pending';
  apiJSON('/api/health')
    .then(d => {
      dot.className = 'conn-dot ok';
      document.getElementById('conn-text').textContent = 'Connected';
      document.getElementById('api-version').textContent = 'v' + (d.version || '?');
      loadFamilies();
    })
    .catch(e => {
      dot.className = 'conn-dot ko';
      document.getElementById('conn-text').textContent = 'Connection failed';
    });
});
</script>
</body>
</html>
