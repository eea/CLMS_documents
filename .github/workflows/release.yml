name: Semantic Release

# Fires after deploy-docs finishes on main. Version-history and changelogs are
# generated on test and arrive with the release merge, so the tag snapshots the
# published version state (test diffs its next release against that tag).
on:
  workflow_run:
    workflows: ["Build and Deploy Documentation"]
    types: [completed]
    branches: [main]

jobs:
  release:
    # Skip if the deploy failed - don't tag a release from a broken build.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (release target)
        uses: actions/checkout@v6
        with:
          # @semantic-release/git pushes the release commit back to main, which
          # the ruleset blocks for github-actions[bot]. Push as the deploy key
          # instead; GITHUB_TOKEN below still covers the API calls.
          ssh-key: ${{ secrets.CI_DEPLOY_KEY }}
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Perform release [${{ github.event.workflow_run.head_branch }}]
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
