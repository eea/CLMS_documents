name: Reconcile Review PR

# Rebuilds review/<date> from the ticked boxes when the draft PR goes Ready.
#
# Runs on ready_for_review only, not edited, so its own comment can't retrigger
# it. To change ticks later: convert to draft, then Ready for review again.
#
# Pushes with CI_DEPLOY_KEY: a GITHUB_TOKEN push doesn't trigger the required
# checks and can't touch .github/workflows/*. A bot pushes last, so either
# CODEOWNER can approve.

on:
  pull_request:
    types: [ready_for_review]
    branches: [test]

jobs:
  reconcile:
    if: startsWith(github.event.pull_request.head.ref, 'review/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # History only, file contents on demand (see open-review-pr.yml).
          filter: blob:none
          ssh-key: ${{ secrets.CI_DEPLOY_KEY }}

      - name: Parse the checklist
        id: selection
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --json body -q .body > /tmp/pr_body.md
          python3 .github/scripts/build_review_checklist.py --parse \
            < /tmp/pr_body.md > /tmp/selection.json

          documents=$(jq '.documents | length' /tmp/selection.json)
          pipeline=$(jq -r '.pipeline' /tmp/selection.json)
          echo "documents=$documents" >> "$GITHUB_OUTPUT"
          echo "pipeline=$pipeline" >> "$GITHUB_OUTPUT"
          echo "Selected: $documents document(s), pipeline=$pipeline"
          jq -r '.documents[]' /tmp/selection.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Return to draft if nothing is selected
        if: steps.selection.outputs.documents == '0' && steps.selection.outputs.pipeline != 'true'
        run: |
          gh pr ready "$PR_NUMBER" --undo
          gh pr comment "$PR_NUMBER" --body \
            "⚠️ Nothing ticked, so the PR is back to draft. Tick at least one item and click **Ready for review** again."
          echo "::error::Empty selection — PR returned to draft."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Re-assemble the branch
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          python3 .github/scripts/assemble_review_branch.py \
            --date "${HEAD_REF#review/}" \
            --selection-file /tmp/selection.json \
            --push
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}

      - name: Summarise what was assembled
        run: |
          documents="${{ steps.selection.outputs.documents }}"
          noun=$([[ "$documents" == "1" ]] && echo document || echo documents)
          summary="**${documents} ${noun}**"
          if [[ "${{ steps.selection.outputs.pipeline }}" == "true" ]]; then
            summary+=" + pipeline"
          fi
          gh pr comment "$PR_NUMBER" --body \
            "✅ Rebuilt: ${summary}. Check **Files changed**, then approve."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
