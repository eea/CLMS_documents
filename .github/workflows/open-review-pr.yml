name: Open Pre-Release Review PR

# Opens a pre-release PR into test (manual, from the Actions tab). Run after
# deploy-docs has finished on develop, or the PR misses the latest cache commits.
#
# Two modes:
#   full      - promote all of develop: gh pr create --base test --head develop.
#   selective - assemble review/<date> (everything selected) and open a DRAFT PR
#               whose body is a tickable checklist. Untick what isn't ready, then
#               click Ready for review; reconcile-review-pr.yml rebuilds the
#               branch to match the ticks.
#
# Title uses chore(docs): on purpose - chore is a no-bump type, so this PR
# can't drive a semantic-release bump (bumps happen at the test->main step).
# If you edit the title, keep a non-bump prefix (chore/docs/style/refactor),
# not feat: or fix:.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = promote all of develop; selective = pick documents via checklist'
        required: true
        default: 'selective'
        type: choice
        options:
          - selective
          - full

jobs:
  open_pr:
    name: Open develop -> test PR
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Full history of commits/trees (the test...develop diff needs the
          # merge base) but no historical file contents; blobs are fetched on
          # demand. Skips ~3.5 GiB of old media versions.
          filter: blob:none
          # Selective mode pushes review/<date> through the deploy key: a
          # GITHUB_TOKEN push is refused when the batch touches
          # .github/workflows/*, and would not trigger the required checks.
          # Empty key (full mode) = the plain default checkout.
          ssh-key: ${{ inputs.mode == 'selective' && secrets.CI_DEPLOY_KEY || '' }}

      - name: Guard — ensure deploy-docs is not still running on develop
        run: |
          echo "Checking whether deploy-docs is currently running on develop..."
          running=$(gh run list \
            --workflow="deploy-docs.yml" \
            --branch=develop \
            --status=in_progress \
            --json databaseId \
            --jq 'length')
          if [[ "$running" -gt 0 ]]; then
            echo "⚠️  'Build and Deploy Documentation' is still running on develop."
            echo "   Wait for it to finish before opening a review PR."
            exit 1
          fi
          echo "✅ No active deploy-docs run on develop."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing PR
        id: check
        run: |
          # Either promotion shape counts as "already in flight": a full
          # develop->test PR, or a selective review/<date> one.
          existing=$(gh pr list \
            --base test \
            --state open \
            --json number,url,headRefName \
            --jq '[.[] | select(.headRefName == "develop" or (.headRefName | startswith("review/")))] | .[0]')

          if [[ -n "$existing" ]]; then
            url=$(echo "$existing" | jq -r '.url')
            number=$(echo "$existing" | jq -r '.number')
            {
              echo "exists=true"
              echo "url=$url"
              echo "number=$number"
            } >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report existing PR
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "✅ A review PR already exists: ${{ steps.check.outputs.url }}"
          echo "   Nothing to do — go approve PR #${{ steps.check.outputs.number }} when you're ready."

      - name: Check develop is ahead of test
        if: steps.check.outputs.exists == 'false'
        id: diff_check
        run: |
          git fetch origin develop test
          ahead=$(git rev-list --count origin/test..origin/develop)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "develop is $ahead commit(s) ahead of test"

      - name: Abort if nothing to review
        if: steps.check.outputs.exists == 'false' && steps.diff_check.outputs.ahead == '0'
        run: |
          echo "⚠️  develop has no new commits ahead of test. Nothing to review."
          exit 1

      - name: Open PR
        if: steps.check.outputs.exists == 'false' && steps.diff_check.outputs.ahead != '0' && inputs.mode == 'full'
        run: |
          today=$(date +%Y-%m-%d)
          title="chore(docs): pre-release batch ${today}"
          body=$(printf '%s\n' \
            '## Pre-release review' \
            '' \
            "develop -> test for review before the next release (${today})." \
            '' \
            '- Review the diff below.' \
            '- Approve to auto-merge.' \
            '- After merge, docs build + deploy to the **test** environment.' \
            '' \
            '_Title prefix: keep a non-bump conventional-commit type (chore / docs / style / refactor)._' \
            '_The bump for the release itself is decided at the test -> main step._')
          url=$(gh pr create \
            --base test \
            --head develop \
            --title "$title" \
            --body "$body")
          echo "🚀 Review PR opened: $url"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open selective draft PR
        if: steps.check.outputs.exists == 'false' && steps.diff_check.outputs.ahead != '0' && inputs.mode == 'selective'
        run: |
          set -euo pipefail
          today=$(date +%Y-%m-%d)
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git diff --name-only origin/test...origin/develop > /tmp/changed.txt
          git diff --name-only --diff-filter=D origin/test...origin/develop > /tmp/deleted.txt

          body=$(python3 .github/scripts/build_review_checklist.py \
            --build --deleted-from /tmp/deleted.txt < /tmp/changed.txt)

          # Assemble with everything selected: a PR's head branch cannot be
          # changed after creation, so review/<date> must already differ from
          # test. Ready for review re-assembles it to match the ticks.
          python3 .github/scripts/assemble_review_branch.py \
            --date "$today" --all --push

          url=$(gh pr create \
            --base test \
            --head "review/${today}" \
            --draft \
            --title "chore(docs): pre-release batch ${today}" \
            --body "$body")
          echo "🚀 Selective draft PR opened: $url"
          echo "   Untick what should wait, then click Ready for review."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
