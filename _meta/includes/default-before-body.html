<script>
  document.addEventListener("DOMContentLoaded", function () {
    // Add Version to the title's metadata
    //
    // Skip when there's no version (e.g. document-type with version off) so we
    // don't render an empty "Version" heading, and when the doc has no
    // title-meta block at all (nothing to append to). Quarto renders an unset
    // meta key as the placeholder "?meta:version", so treat that as empty too.
    const raw = `{{< meta version >}}`.trim();
    const version = raw.startsWith("?meta:") ? "" : raw;
    const titleMetaEl = document.querySelector(".quarto-title-meta");
    if (!version || !titleMetaEl) return;
    const wrapperDiv = document.createElement("div");
    wrapperDiv.innerHTML = `
        <div class="quarto-title-meta-heading">Version</div>
        <div class="quarto-title-meta-contents">
          <p>{{< meta version >}}</p>
        </div>
      `;
    titleMetaEl.appendChild(wrapperDiv);
  });
</script>
