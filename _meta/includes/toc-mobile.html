<!-- Mobile-only "Contents" button that reveals the section TOC, which the
     full-width HTML layout hides on small screens. Styling is in
     theme/styles.css (.toc-mobile-btn / body.toc-mobile-open). -->
<script>
(function () {
  var toc = document.getElementById('TOC');
  if (!toc) return; // no section TOC on this page (e.g. listings) -> no button

  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'toc-mobile-btn';
  btn.setAttribute('aria-label', 'Toggle table of contents');
  btn.innerHTML = '☰ Contents';
  btn.addEventListener('click', function () {
    document.body.classList.toggle('toc-mobile-open');
  });
  document.body.appendChild(btn);

  // Tapping a TOC link closes the panel.
  toc.addEventListener('click', function (e) {
    if (e.target.closest('a')) document.body.classList.remove('toc-mobile-open');
  });
})();
</script>
